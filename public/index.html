<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#02070d">
  <meta name="description" content="Jarvis — assistant vocal personnel">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>J.A.R.V.I.S.</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-state="offline">
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="status-line">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Hors ligne</span>
    </div>
    <button id="settings-btn" class="icon-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main>
    <button id="reactor" class="reactor" aria-label="Activer Jarvis">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#bff8ff"/>
            <stop offset="70%" stop-color="#20d9ff"/>
            <stop offset="100%" stop-color="#0a6c8f" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="ring ring-outer" cx="100" cy="100" r="94"/>
        <circle class="ring ring-ticks" cx="100" cy="100" r="86"/>
        <g class="ring-segments">
          <circle cx="100" cy="100" r="74"/>
        </g>
        <circle class="ring ring-inner" cx="100" cy="100" r="60"/>
        <g class="coils"></g>
        <circle class="ring ring-core-edge" cx="100" cy="100" r="34"/>
        <polygon class="triangle" points="100,74 123,114 77,114"/>
        <circle class="core" cx="100" cy="100" r="26" fill="url(#core-grad)"/>
      </svg>
    </button>

    <section class="readout" aria-live="polite">
      <p id="transcript" class="transcript"></p>
      <p id="reply" class="reply"></p>
    </section>
  </main>

  <footer class="hud-bottom">
    <span id="hint">Touchez le réacteur pour initialiser</span>
  </footer>

  <div id="error-banner" class="error-banner" role="alert" hidden>
    <span id="error-text"></span>
    <button id="error-retry" class="btn">Réessayer</button>
  </div>

  <dialog id="settings" class="settings">
    <form method="dialog">
      <h2>Réglages</h2>
      <label>Voix
        <select id="voice-select"></select>
      </label>
      <label>Débit <output id="rate-out"></output>
        <input id="rate" type="range" min="0.7" max="1.3" step="0.05">
      </label>
      <label>Hauteur <output id="pitch-out"></output>
        <input id="pitch" type="range" min="0.5" max="1.5" step="0.05">
      </label>
      <label>Code d'accès (si configuré sur le serveur)
        <input id="token" type="password" autocomplete="off" placeholder="Laisser vide sinon">
      </label>
      <div class="settings-actions">
        <button type="button" id="test-voice" class="btn">Tester la voix</button>
        <button type="button" id="clear-history" class="btn">Effacer la conversation</button>
        <button value="close" class="btn btn-primary">Fermer</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
